name: Hospodárenie obcí (RÚZ)

# Účtovné závierky všetkých obcí – pomalé API, každý beh max. ~100 min, pokračuje ďalší deň.
on:
  schedule:
    - cron: "47 1 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/zber_hospodarenie_obce.py"
      - ".github/workflows/hospodarenie-obce.yml"

permissions:
  contents: write

concurrency:
  group: hospodarenie-obce
  cancel-in-progress: false

jobs:
  ruz:
    runs-on: ubuntu-latest
    timeout-minutes: 130
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - run: pip install -r scripts/requirements.txt

      - name: Hospodárenie obcí z Registra účtovných závierok
        run: python scripts/zber_hospodarenie_obce.py

      - name: Uložiť zmeny v dátach
        if: success() || failure()
        run: |
          git config user.name "mestovcislach-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "Žiadne nové dáta."
          else
            git commit -m "Dáta: hospodárenie obcí $(date -u +%Y-%m-%d)"
            for i in 1 2 3 4 5; do git pull --rebase -X theirs -q && git push && break; sleep $((i * 5)); done
            git fetch -q origin main && git diff --quiet HEAD origin/main -- data || { echo "::error::Push dát zlyhal"; exit 1; }
          fi

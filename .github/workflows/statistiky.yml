name: Týždenné štatistiky návštevnosti

on:
  schedule:
    - cron: "7 6 * * 1"  # pondelok ráno (7:07 SEČ / 8:07 SELČ)
  workflow_dispatch:

permissions:
  contents: read

jobs:
  statistiky:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
      BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
      STATISTIKY_EMAIL: ${{ secrets.STATISTIKY_EMAIL }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt
      - run: pip install -r scripts/requirements.txt
      - name: Štatistiky za posledný týždeň → e-mail
        run: python scripts/statistiky_tyzden.py

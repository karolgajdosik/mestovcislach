name: Obce – nezamestnanosť, odpad, školy

# ÚPSVaR (mesačne, vychádza okolo 20. dňa), ŠÚ SR odpad (ročne), mapa škôl MŠVVaM – stačí raz týždenne.
# Pomaly sa meniace zdroje (STATdata ~100 min, voľby, vlaky, chránené územia) bežia len v prvý utorok v mesiaci,
# pri ručnom spustení a pri zmene skriptov – týždenný beh tak trvá ~15 min namiesto ~2,5 h.
on:
  schedule:
    - cron: "23 5 * * 2"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/zber_obce_temy.py"
      - "scripts/zber_obce_statdata.py"
      - "scripts/statdata_obce.py"
      - "scripts/zber_obce_volby.py"
      - "scripts/zber_obce_vlaky.py"
      - "scripts/zber_obce_vrstvy.py"
      - "scripts/zber_okresy_statdata.py"
      - "scripts/zber_obce_wiki_osm.py"
      - "scripts/zber_obce_ovzdusie.py"
      - ".github/workflows/obce-temy.yml"
      - "scripts/osm_lokalne.py"
      - ".github/actions/osm/action.yml"

permissions:
  contents: write

concurrency:
  group: obce-temy
  cancel-in-progress: false

jobs:
  temy:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 50

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - run: pip install -r scripts/requirements.txt

      - name: OSM výrez Slovenska (osmium, Geofabrik – namiesto verejného Overpass)
        uses: ./.github/actions/osm

      - name: Plán behu (týždenný alebo plný mesačný)
        id: plan
        env:
          PRED: ${{ github.event.before }}
        run: |
          # plný beh: prvý týždeň v mesiaci, ručné spustenie, alebo push so zmenou niektorého mesačného skriptu
          # (pri bežnom pushi netreba znova sťahovať STATdata – trvá to až 100 minút)
          plne=0
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then plne=1
          elif [ "${{ github.event_name }}" = "schedule" ]; then [ "$(date -u +%-d)" -le 7 ] && plne=1
          else
            git fetch -q --depth=50 origin main 2>/dev/null || true
            zmeny=$(git diff --name-only "$PRED" HEAD 2>/dev/null || echo "?")
            grep -qE 'zber_obce_(statdata|volby|vlaky|vrstvy)\.py|^\?$' <<<"$zmeny" && plne=1
          fi
          echo "plne=$plne" >> "$GITHUB_OUTPUT"
          [ $plne = 1 ] && echo "Plný beh" || echo "Týždenný beh – STATdata, voľby, vlaky a chránené územia sa preskočia"

      - name: Nezamestnanosť (ÚPSVaR), komunálny odpad (ŠÚ SR), školy (MŠVVaM)
        run: python scripts/zber_obce_temy.py

      - name: Pohyb obyvateľstva, bývanie (SODB 2021), firmy, služby, turizmus (ŠÚ SR)
        if: (success() || failure()) && steps.plan.outputs.plne == '1'
        run: python scripts/zber_obce_statdata.py

      - name: Voľby NRSR 2023 a EP 2024 po obciach
        if: (success() || failure()) && steps.plan.outputs.plne == '1'
        run: python scripts/zber_obce_volby.py

      - name: Vlaky v obciach (GTFS ŽSR)
        if: (success() || failure()) && steps.plan.outputs.plne == '1'
        run: python scripts/zber_obce_vlaky.py

      - name: Chránené územia (ŠOP SR) vrátane Natura 2000 a chránených stromov
        if: (success() || failure()) && steps.plan.outputs.plne == '1'
        run: python scripts/zber_obce_vrstvy.py

      - name: Okresy – mzdy a dokončené byty (ŠÚ SR)
        if: success() || failure()
        run: python scripts/zber_okresy_statdata.py

      - name: Wikidata a OpenStreetMap (pamiatky, obchody, zastávky, trasy)
        if: success() || failure()
        timeout-minutes: 60
        run: python scripts/zber_obce_wiki_osm.py

      - name: Kvalita ovzdušia (SHMÚ cez EEA)
        if: success() || failure()
        timeout-minutes: 30
        run: python scripts/zber_obce_ovzdusie.py

      - name: Uložiť zmeny v dátach
        if: success() || failure()
        run: |
          git config user.name "mestovcislach-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "Žiadne nové dáta."
          else
            git commit -m "Dáta: obce – nezamestnanosť, odpad, školy, ŠÚ SR, voľby $(date -u +%Y-%m-%d)"
            for i in 1 2 3 4 5; do git pull --rebase -X theirs -q && git push && break; sleep $((i * 5)); done
            git fetch -q origin main && git diff --quiet HEAD origin/main -- data || { echo "::error::Push dát zlyhal"; exit 1; }
          fi

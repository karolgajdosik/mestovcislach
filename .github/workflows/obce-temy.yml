name: Obce – nezamestnanosť, odpad, školy

# ÚPSVaR (mesačne, vychádza okolo 20. dňa), ŠÚ SR odpad (ročne), mapa škôl MŠVVaM – stačí raz týždenne.
on:
  schedule:
    - cron: "23 5 * * 2"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/zber_obce_temy.py"
      - ".github/workflows/obce-temy.yml"

permissions:
  contents: write

concurrency:
  group: obce-temy
  cancel-in-progress: false

jobs:
  temy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - run: pip install -r scripts/requirements.txt

      - name: Nezamestnanosť (ÚPSVaR), komunálny odpad (ŠÚ SR), školy (MŠVVaM)
        run: python scripts/zber_obce_temy.py

      - name: Uložiť zmeny v dátach
        if: success() || failure()
        run: |
          git config user.name "mestovcislach-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "Žiadne nové dáta."
          else
            git commit -m "Dáta: nezamestnanosť, odpad a školy v obciach $(date -u +%Y-%m-%d)"
            for i in 1 2 3 4 5; do git pull --rebase -X theirs -q && git push && break; sleep $((i * 5)); done
            git fetch -q origin main && git diff --quiet HEAD origin/main -- data || { echo "::error::Push dát zlyhal"; exit 1; }
          fi

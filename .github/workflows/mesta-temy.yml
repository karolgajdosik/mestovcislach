name: Život v mestách

# Školy, doprava, bezpečnosť, prostredie a kultúra krajských miest (ŠÚ SR), ovzdušie (EEA) a vlaky (GTFS ŽSR) – raz týždenne.
on:
  schedule:
    - cron: "40 3 * * 1" # v pondelok ráno
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/zber_mesta_temy.py"
      - "scripts/zber_ovzdusie_eea.py"
      - "scripts/zber_vlaky.py"
      - "scripts/zber_mhd_presov.py"
      - "scripts/zber_firmy_miest.py"
      - ".github/workflows/mesta-temy.yml"

permissions:
  contents: write

concurrency:
  group: zber-mesta-temy
  cancel-in-progress: false

jobs:
  temy:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - run: pip install -r scripts/requirements.txt

      - name: Školy, doprava, bezpečnosť, prostredie, kultúra (ŠÚ SR)
        run: python scripts/zber_mesta_temy.py

      - name: Kvalita ovzdušia (EEA)
        if: success() || failure()
        run: python scripts/zber_ovzdusie_eea.py

      - name: Vlaky (GTFS ŽSR)
        if: success() || failure()
        run: python scripts/zber_vlaky.py

      - name: MHD Prešov (GTFS DPMP)
        if: success() || failure()
        run: python scripts/zber_mhd_presov.py

      - name: Firmy miest (vlastníctvo z RPO, závierky z RÚZ)
        if: success() || failure()
        timeout-minutes: 45
        run: python scripts/zber_firmy_miest.py

      - name: Uložiť zmeny v dátach
        if: success() || failure()
        run: |
          git config user.name "mestovcislach-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "Žiadne nové dáta."
          else
            git commit -m "Dáta: život v mestách $(date -u +%Y-%m-%d)"
            for i in 1 2 3 4 5; do git pull --rebase -X theirs -q && git push && break; sleep $((i * 5)); done
            git fetch -q origin main && git diff --quiet HEAD origin/main -- data || { echo "::error::Push dát zlyhal"; exit 1; }
          fi

name: diag
on:
  push:
    branches: [diag]
permissions:
  contents: write
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: |
          rm -rf diag; mkdir -p diag
          UA="mestovcislach.sk (github.com/karolgajdosik/mestovcislach)"
          rm -f diag/*
          g(){ curl -sS -L -m 60 -A "$UA" "$1" -o "diag/$2" -w "$1 %{http_code} %{size_download} %{url_effective}\n" >> diag/r_status.txt || echo "$1 fail" >> diag/r_status.txt; }
          pip install -q requests openpyxl
          python diag_live.py > diag/log.txt 2>&1 || true

          git config user.name diag; git config user.email diag@users.noreply.github.com
          git add -A diag; git commit -m diag-out -- diag; git push

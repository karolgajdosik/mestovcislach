name: Obce – pamiatky pre prelet

# Významné chránené pamiatky so súradnicami, textom a fotkou (Wikidata, Wikipédia, Commons) – mení sa pomaly, stačí raz mesačne.
on:
  schedule:
    - cron: "37 3 9 * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/zber_pamiatky_body.py"
      - ".github/workflows/obce-pamiatky-body.yml"

permissions:
  contents: write

concurrency:
  group: obce-pamiatky-body
  cancel-in-progress: false

jobs:
  pamiatky:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt
      - run: pip install -r scripts/requirements.txt
      - name: Pamiatky pre prelet (Wikidata)
        run: python scripts/zber_pamiatky_body.py
      - name: Uložiť zmeny
        run: |
          git config user.name "mestovcislach-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/obce/pamiatky-body.json
          git diff --cached --quiet && exit 0
          git commit -m "Dáta: pamiatky pre prelet $(date -u +%Y-%m-%dT%H:%M)"
          for i in 1 2 3; do git pull --rebase && git push && exit 0; sleep 10; done
          exit 1

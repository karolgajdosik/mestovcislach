name: OpenStreetMap

# Cyklotrasy a vybavenosť z OpenStreetMap – raz týždenne, ručne alebo pri zmene skriptov.
on:
  schedule:
    - cron: "40 3 * * 0" # v nedeľu ráno
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/zber_cyklo.py"
      - "scripts/zber_vybavenost.py"
      - "scripts/zber_scitanie.py"
      - "scripts/zber_priroda.py"
      - ".github/workflows/cyklo.yml"

permissions:
  contents: write

concurrency:
  group: zber-osm
  cancel-in-progress: false

jobs:
  cyklo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - run: pip install -r scripts/requirements.txt

      - name: Cyklotrasy (OpenStreetMap)
        run: python scripts/zber_cyklo.py

      - name: Vybavenosť (OpenStreetMap)
        if: success() || failure()
        run: python scripts/zber_vybavenost.py

      - name: Sčítanie 2021 (ŠÚ SR STATdata)
        if: success() || failure()
        run: python scripts/zber_scitanie.py

      - name: Chránená príroda (EEA)
        if: success() || failure()
        run: python scripts/zber_priroda.py

      - name: Uložiť zmeny v dátach
        if: success() || failure()
        run: |
          git config user.name "mestovcislach-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ public/data/
          if git diff --cached --quiet; then
            echo "Žiadne nové dáta."
          else
            git commit -m "Dáta: OpenStreetMap $(date -u +%Y-%m-%d)"
            for i in 1 2 3; do git pull --rebase -q && git push && break; sleep 5; done
          fi

name: Claude (@claude v issues a PR)

# Napíšte „@claude …“ do issue, komentára alebo PR – Claude odpovie, prípadne pripraví zmenu ako pull request.
# Prihlásenie predplatným Claude (nie API kľúčom, takže sa neplatí za tokeny): secret CLAUDE_CODE_OAUTH_TOKEN
# (vytvorí ho príkaz `claude setup-token` v Claude Code na počítači majiteľa) + nainštalovaná aplikácia https://github.com/apps/claude.
# Spustiť ho môže len používateľ s právom zápisu do repozitára (kontroluje to samotná akcia).
on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]

concurrency:
  group: claude-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  claude:
    if: >-
      contains(github.event.comment.body, '@claude') ||
      contains(github.event.issue.body, '@claude') ||
      contains(github.event.issue.title, '@claude')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - name: Je nastavený token predplatného?
        id: token
        env:
          T: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -z "$T" ]; then echo "::notice::Chýba secret CLAUDE_CODE_OAUTH_TOKEN – @claude zatiaľ nie je zapnutý."; echo "ok=0" >> "$GITHUB_OUTPUT"; else echo "ok=1" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/checkout@v5
        if: steps.token.outputs.ok == '1'
        with:
          fetch-depth: 1
      - uses: anthropics/claude-code-action@v1
        if: steps.token.outputs.ok == '1'
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: "--max-turns 40"

name: Obce – Testovanie 9 a rozpočty

# NIVAM Testovanie 9 (výsledky škôl, ročne) a plnenie rozpočtov obcí z rozpocet.sk (priebežne, ~40 min na beh).
on:
  schedule:
    - cron: "41 4 * * 3"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/zber_obce_t9.py"
      - "scripts/zber_obce_rozpocet.py"
      - ".github/workflows/obce-doplnky.yml"

permissions:
  contents: write

concurrency:
  group: obce-doplnky
  cancel-in-progress: false

jobs:
  doplnky:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - run: pip install -r scripts/requirements.txt

      - name: Testovanie 9 (NIVAM)
        timeout-minutes: 20
        run: python scripts/zber_obce_t9.py

      - name: Rozpočty obcí (rozpocet.sk)
        if: success() || failure()
        timeout-minutes: 50
        run: python scripts/zber_obce_rozpocet.py

      - name: Uložiť zmeny v dátach
        if: success() || failure()
        run: |
          git config user.name "mestovcislach-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "Žiadne nové dáta."
          else
            git commit -m "Dáta: obce – Testovanie 9, rozpočty $(date -u +%Y-%m-%d)"
            for i in 1 2 3 4 5; do git pull --rebase -X theirs -q && git push && break; sleep $((i * 5)); done
            git fetch -q origin main && git diff --quiet HEAD origin/main -- data || { echo "::error::Push dát zlyhal"; exit 1; }
          fi

name: Katalógy miest

# Tri súbežné časti (beh trvá ako najdlhšia z nich, nie ich súčet):
#   zaklad       – katalóg a tabuľky data.bratislava.sk, vrstvy, faktúry, bezpečnosť, klíma, Košice, samospráva (týždenne)
#   hospodarenie – účtovné závierky miest z RÚZ (inkrementálne – sťahujú sa len nové závierky) a dlh z MF SR; dáta sú ročné,
#                  preto len prvý utorok v mesiaci (alebo ručne / pri zmene skriptu)
#   mapy         – mapy krajských miest z výrezu OpenStreetMap (scripts/osm_lokalne.py, bez verejného Overpass)
# Pri pushi sa spustí len časť, ktorej skript sa zmenil. Ručne sa dá zvoliť časť.
on:
  schedule:
    - cron: "20 4 * * 2" # v utorok ráno
  workflow_dispatch:
    inputs:
      cast:
        description: "Ktorá časť"
        type: choice
        options: [vsetko, zaklad, hospodarenie, mapy]
        default: vsetko
  push:
    branches: [main]
    paths:
      - "scripts/zber_katalog.py"
      - "scripts/zber_tabulky.py"
      - "scripts/katalog_pravidla.py"
      - "scripts/diakritika.py"
      - "scripts/zber_vrstvy.py"
      - "scripts/zber_faktury.py"
      - "scripts/zber_bezpecnost.py"
      - "scripts/zber_klima.py"
      - "scripts/zber_mapa_mesta.py"
      - "scripts/zber_mapa_osm.py"
      - "scripts/osm_lokalne.py"
      - "scripts/zber_samosprava_mesta.py"
      - "scripts/zber_hospodarenie.py"
      - ".github/workflows/katalog.yml"

permissions:
  contents: write

concurrency:
  group: zber-katalog
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      zaklad: ${{ steps.p.outputs.zaklad }}
      hospodarenie: ${{ steps.p.outputs.hospodarenie }}
      mapy: ${{ steps.p.outputs.mapy }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: p
        env:
          UDALOST: ${{ github.event_name }}
          CAST: ${{ inputs.cast }}
          PRED: ${{ github.event.before }}
        run: |
          z=false; h=false; m=false
          if [ "$UDALOST" = "workflow_dispatch" ]; then
            case "$CAST" in zaklad) z=true;; hospodarenie) h=true;; mapy) m=true;; *) z=true; h=true; m=true;; esac
          elif [ "$UDALOST" = "schedule" ]; then
            z=true; m=true
            [ "$(date -u +%d)" -le 7 ] && h=true   # prvý utorok v mesiaci
          else
            zmeny=$(git diff --name-only "$PRED" HEAD 2>/dev/null || echo ".github/workflows/katalog.yml")
            echo "$zmeny"
            grep -qE 'zber_(katalog|tabulky|vrstvy|faktury|bezpecnost|klima|mapa_mesta|samosprava_mesta)\.py|katalog_pravidla\.py|diakritika\.py' <<<"$zmeny" && z=true
            grep -q 'zber_hospodarenie\.py' <<<"$zmeny" && h=true
            grep -qE 'zber_mapa_osm\.py|osm_lokalne\.py' <<<"$zmeny" && m=true
            grep -q 'workflows/katalog\.yml' <<<"$zmeny" && { z=true; m=true; }
          fi
          echo "zaklad=$z hospodarenie=$h mapy=$m"
          { echo "zaklad=$z"; echo "hospodarenie=$h"; echo "mapy=$m"; } >> "$GITHUB_OUTPUT"

  zaklad:
    needs: plan
    if: needs.plan.outputs.zaklad == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt
      - run: pip install -r scripts/requirements.txt

      - name: Cache registra adries MV SR (záloha pri výpadku rageo.minv.sk)
        uses: actions/cache@v4
        with:
          path: .cache/adresy
          key: adresy-mv-${{ github.run_id }}
          restore-keys: adresy-mv-

      - name: Inventár datasetov (data.bratislava.sk)
        run: python scripts/zber_katalog.py

      - name: Tabuľky (data.bratislava.sk)
        if: (success() || failure()) && hashFiles('scripts/zber_tabulky.py') != ''
        run: python scripts/zber_tabulky.py

      - name: Mapové vrstvy (bezbariérovosť, fontány, športoviská, pomoc, stromy)
        if: success() || failure()
        run: python scripts/zber_vrstvy.py

      - name: Faktúry, objednávky a zmluvy (magistrát, OLO, Marianum, MIB)
        if: success() || failure()
        run: python scripts/zber_faktury.py

      - name: Bezpečnosť a podnety občanov
        if: success() || failure()
        run: python scripts/zber_bezpecnost.py

      - name: Klimatický atlas a hustota obyvateľov
        if: success() || failure()
        run: python scripts/zber_klima.py

      - name: Katalóg Košíc (opendata.kosice.sk)
        if: success() || failure()
        env:
          MESTO: kosice
        run: python scripts/zber_katalog.py && python scripts/zber_tabulky.py && python scripts/zber_mapa_mesta.py

      - name: Samospráva miest – hlasovania poslancov, zmluvy, faktúry, objednávky
        if: success() || failure()
        run: python scripts/zber_samosprava_mesta.py

      - name: Uložiť zmeny v dátach
        if: success() || failure()
        run: bash scripts/uloz_data.sh "katalógy miest"

  hospodarenie:
    needs: plan
    if: needs.plan.outputs.hospodarenie == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt
      - run: pip install -r scripts/requirements.txt
      - name: Hospodárenie miest (účtovné závierky RÚZ – len nové, dlh MF SR)
        timeout-minutes: 50
        run: python scripts/zber_hospodarenie.py
      - name: Uložiť zmeny v dátach
        if: success() || failure()
        run: bash scripts/uloz_data.sh "hospodárenie miest"

  mapy:
    needs: plan
    if: needs.plan.outputs.mapy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt
      - run: pip install -r scripts/requirements.txt
      - name: OSM výrez Slovenska (osmium, Geofabrik – namiesto verejného Overpass)
        uses: ./.github/actions/osm
      - name: Mapy krajských miest (OpenStreetMap)
        # pri chybe ostanú mapy z posledného úspešného behu; upozornenia sú v logu
        continue-on-error: true
        timeout-minutes: 50
        run: python scripts/zber_mapa_osm.py
      - name: Uložiť zmeny v dátach
        if: success() || failure()
        run: bash scripts/uloz_data.sh "mapy krajských miest (OSM)"

name: Katalóg Bratislavy

# Inventár všetkých datasetov data.bratislava.sk a všeobecný import tabuliek – raz týždenne, ručne alebo pri zmene skriptov.
on:
  schedule:
    - cron: "20 4 * * 2" # v utorok ráno
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/zber_katalog.py"
      - "scripts/zber_tabulky.py"
      - "scripts/katalog_pravidla.py"
      - "scripts/diakritika.py"
      - "scripts/zber_vrstvy.py"
      - "scripts/zber_faktury.py"
      - "scripts/zber_bezpecnost.py"
      - ".github/workflows/katalog.yml"

permissions:
  contents: write

concurrency:
  group: zber-katalog
  cancel-in-progress: false

jobs:
  katalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - run: pip install -r scripts/requirements.txt

      - name: Inventár datasetov (data.bratislava.sk)
        run: python scripts/zber_katalog.py

      - name: Tabuľky (data.bratislava.sk)
        if: (success() || failure()) && hashFiles('scripts/zber_tabulky.py') != ''
        run: python scripts/zber_tabulky.py

      - name: Mapové vrstvy (bezbariérovosť, fontány, športoviská, pomoc, stromy)
        if: success() || failure()
        run: python scripts/zber_vrstvy.py

      - name: Faktúry, objednávky a zmluvy (magistrát, OLO, Marianum, MIB)
        if: success() || failure()
        run: python scripts/zber_faktury.py

      - name: Bezpečnosť a podnety občanov
        if: success() || failure()
        run: python scripts/zber_bezpecnost.py

      - name: Uložiť zmeny v dátach
        if: success() || failure()
        run: |
          git config user.name "mestovcislach-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ public/data/
          if git diff --cached --quiet; then
            echo "Žiadne nové dáta."
          else
            git commit -m "Dáta: katalóg Bratislavy $(date -u +%Y-%m-%d)"
            for i in 1 2 3; do git pull --rebase -q && git push && break; sleep 5; done
          fi

name: Komunálne voľby

on:
  schedule:
    - cron: "10 3 * * *"          # bežne raz denne
    - cron: "*/15 18-23 24 10 *"  # volebná noc 24. 10. (UTC, v Bratislave 20:00–02:00)
    - cron: "*/20 * 25-26 10 *"   # 25. – 26. 10. každých 20 minút, kým ŠÚ SR zverejní výsledky
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/zber_komunalne.py"
      - ".github/workflows/volby.yml"

permissions:
  contents: write

concurrency:
  group: komunalne-volby
  cancel-in-progress: false

jobs:
  zber:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt
      - run: pip install -r scripts/requirements.txt
      - name: Komunálne a krajské voľby (ŠÚ SR)
        run: python scripts/zber_komunalne.py
      - name: Uložiť zmeny v dátach
        if: success() || failure()
        run: |
          git config user.name "mestovcislach-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/komunalne-bratislava.json
          if git diff --cached --quiet; then
            echo "Žiadne nové dáta."
          else
            git commit -m "Dáta: komunálne voľby $(date -u +%Y-%m-%dT%H:%M)"
            for i in 1 2 3; do git pull --rebase -q && git push && break; sleep 10; done
          fi

name: Celoštátne dáta

# Dáta z Národného katalógu otvorených dát (data.slovensko.sk) – raz týždenne, ručne alebo pri zmene skriptov.
on:
  schedule:
    - cron: "10 4 * * 1" # v pondelok ráno
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/spolocne.py"
      - "scripts/zber_pamiatky.py"
      - "scripts/zber_skoly_iedu.py"
      - "scripts/zber_socialne.py"
      - "scripts/zber_stromy.py"
      - "scripts/zber_hluk.py"
      - "scripts/zber_ukazovatele.py"
      - ".github/workflows/slovensko.yml"

permissions:
  contents: write

concurrency:
  group: zber-slovensko
  cancel-in-progress: false

jobs:
  slovensko:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - run: pip install -r scripts/requirements.txt

      - name: Kultúrne pamiatky (MK SR + register adries MV SR)
        run: python scripts/zber_pamiatky.py

      - name: Školy – žiaci, učitelia, záujem o SŠ (MŠVVaM SR)
        if: success() || failure()
        run: python scripts/zber_skoly_iedu.py

      - name: Sociálne služby (MPSVR SR)
        if: success() || failure()
        run: python scripts/zber_socialne.py

      - name: Chránené stromy (ŠOP SR)
        if: success() || failure()
        run: python scripts/zber_stromy.py

      - name: Hlukové mapy (ÚVZ SR)
        if: success() || failure()
        run: python scripts/zber_hluk.py

      - name: Index rozvoja, dlh MČ, sčítanie dopravy (MIRRI, MF SR, SSC)
        if: success() || failure()
        run: python scripts/zber_ukazovatele.py

      - name: Uložiť zmeny v dátach
        if: success() || failure()
        run: |
          git config user.name "mestovcislach-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ public/data/
          if git diff --cached --quiet; then
            echo "Žiadne nové dáta."
          else
            git commit -m "Dáta: data.slovensko.sk $(date -u +%Y-%m-%d)"
            for i in 1 2 3 4 5; do git pull --rebase -X theirs -q && git push && break; sleep $((i * 5)); done
            git fetch -q origin main && git diff --quiet HEAD origin/main -- data public/data || { echo "::error::Push dát zlyhal"; exit 1; }
          fi

name: Hranice

# Hranice mestských častí sa menia zriedka – spúšťa sa ručne alebo pri zmene skriptu.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/zber_hranice.py"
      - ".github/workflows/hranice.yml"

permissions:
  contents: write

concurrency:
  group: zber-dat
  cancel-in-progress: false

jobs:
  hranice:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - run: pip install -r scripts/requirements.txt

      - name: Hranice mestských častí (OpenStreetMap)
        run: python scripts/zber_hranice.py

      - name: Uložiť zmeny v dátach
        run: |
          git config user.name "mestovcislach-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "Žiadne nové dáta."
          else
            git commit -m "Dáta: hranice mestských častí $(date -u +%Y-%m-%d)"
            git pull --rebase -q && git push
          fi
